change-template: "- $TITLE @$AUTHOR #$NUMBER"
sort-direction: ascending

name-template: "mDNS TUI Browser Release v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
tag-prefix: v

version-resolver:
  major:
    labels:
      - "major"
      - "breaking-change"
  minor:
    labels:
      - "feature"
      - "enhancement"

  patch:
    labels:
      - "patch"
      - "bug"
      - "bugfix"
      - "dependencies"

  default: patch

category-template: "### $TITLE"
categories:
  - title: ":boom: Breaking Changes"
    when:
      labels:
        - "breaking-change"

  - title: ":sparkles: New Features"
    when:
      labels:
        - "enhancement"

  - title: ":bug: Bug Fixes"
    when:
      labels:
        - "bug"
        - "bugfix"

  - title: "🧰 Maintenance"
    when:
      labels:
        - "chore"

  - title: ":zap: Performance"
    when:
      labels:
        - "performance"

  - title: ":recycle: Refactor"
    when:
      labels:
        - "refactor"

  - title: ":scroll: Documentation"
    when:
      labels:
        - "documentation"

  - title: ":white_check_mark: Test"
    when:
      labels:
        - "test"

  - title: ":arrow_up: Dependency Updates"
    when:
      labels:
        - "dependencies"
    collapse-after: 10

exclude-labels:
  - ignore

header: |

  ## What's Changed

template: |

  $CHANGES

footer: |

  ### Full Changelog
  [$PREVIOUS_TAG...v$RESOLVED_VERSION](https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION)
