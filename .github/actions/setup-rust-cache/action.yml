name: Setup rust cache
description: Sets up rust cache
inputs:
  targets:
    description: "Toolchain target triples"
    required: false
    default: ""
  components:
    description: "Toolchain components"
    required: false
    default: ""
  save-cache:
    description: "Whether to save the cache"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - shell: bash
      run: |
        echo "🔍Components: ${{ inputs.components }}"
        echo "🔍Targets: ${{ inputs.targets }}"
        echo "🔍Save-Cache: ${{ inputs.save-cache }}"

    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        save-if: ${{ inputs.save-cache }}
        cache-bin: false
        cache-targets: false
        prefix-key: "v1-rust"
        shared-key: "shared"
