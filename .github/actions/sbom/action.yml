name: Create and scan SBOM action
description: Creates and scans the sbom for security vulnerabilities

inputs:
  artifact-name:
    description: "The name of the sbom upload artifact"
    required: true

runs:
  using: "composite"
  steps:
    - name: 🏷️ Get version
      id: get-version
      shell: bash
      run: |
        VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: 📜 Create SBOM
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
      env:
        SYFT_SOURCE_NAME: ${{ github.event.repository.name }}
        SYFT_SOURCE_VERSION: ${{ steps.get-version.outputs.version }}
      with:
        format: "spdx-json"
        output-file: "sbom.spdx.json"
        upload-artifact: false
        upload-release-assets: false

    - name: 📤 Upload SBOM artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: sbom.spdx.json

    - name: 🔍 Scan SBOM
      id: scan
      uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
      with:
        sbom: "sbom.spdx.json"
        severity-cutoff: medium
        cache-db: ${{ github.ref == 'refs/heads/main' }}

    - name: 🔍 Inspect SARIF report
      if: ${{ !cancelled() && steps.scan.outputs.sarif != '' && runner.os != 'Windows' }}
      shell: bash
      run: |
        jq . ${{ steps.scan.outputs.sarif }}

    - name: 🔍 Inspect SARIF report
      if: ${{ !cancelled() && steps.scan.outputs.sarif != '' && runner.os == 'Windows' }}
      shell: pwsh
      run: |
        jq . ${{ steps.scan.outputs.sarif }}
