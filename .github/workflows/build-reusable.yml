name: "Reusable build workflow"

on:
  workflow_call:
    inputs:
      branch:
        required: false
        type: string
        default: ""
      tagName:
        required: false
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "ubuntu-22.04"
            symbol: 🐧 x86_64 glibc-2.35
            target: x86_64-unknown-linux-gnu
            platform: Linux-x86_64-glibc-2.35
          - os: "ubuntu-latest"
            symbol: 🐧 x86_64 latest
            target: x86_64-unknown-linux-gnu
            platform: Linux-x86_64
          - os: "ubuntu-latest"
            symbol: 🐧 aarch64 latest
            target: aarch64-unknown-linux-gnu
            platform: Linux-aarch64
            dependencies: |
              sudo apt-get update
              sudo apt-get -y install gcc-aarch64-linux-gnu
          - os: "ubuntu-latest"
            symbol: 🐧 arm latest
            target: arm-unknown-linux-gnueabihf
            platform: Linux-arm
            dependencies: |
              sudo apt-get update
              sudo apt-get -y install gcc-arm-linux-gnueabihf
          - os: "macos-latest"
            symbol: 🍏 aarch64 latest
            target: aarch64-apple-darwin
            platform: macOS-aarch64
          - os: "macos-latest"
            symbol: 🍏 x86_64 latest
            target: x86_64-apple-darwin
            platform: macOS-x86_64
          - os: "windows-latest"
            symbol: 🪟 x86_64 latest
            platform: Windows-x86_64
            target: x86_64-pc-windows-msvc

    name: ${{matrix.symbol}}🔨
    runs-on: ${{matrix.os}}
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: ${{ inputs.tagName && '0' || '1' }}
          ref: ${{ inputs.tagName || '' }}

      - name: 🦀🚀
        uses: ./.github/actions/setup-rust-cache
        with:
          targets: ${{ matrix.target }}
          save-cache: ${{ inputs.branch == 'main' }}

      - name: 🛠️🔐 cargo-auditable
        if: inputs.tagName
        uses: baptiste0928/cargo-install@f204293d9709061b7bc1756fec3ec4e2cd57dec0 # v3
        with:
          crate: cargo-auditable
          version: 0.7.4
          locked: true

      - name: 🛠️📦 cargo-deb
        if: contains(matrix.os, 'ubuntu')
        uses: baptiste0928/cargo-install@f204293d9709061b7bc1756fec3ec4e2cd57dec0 # v3
        with:
          crate: cargo-deb
          version: 3.6.3
          locked: true

      - name: 🛠️ dependencies
        if: matrix.dependencies
        shell: bash
        run: |
          ${{ matrix.dependencies }}

      - name: 🛠️🚀
        if: (!inputs.tagName)
        uses: ./.github/actions/setup-sccache

      - name: 🔨 Build release binary
        shell: bash
        env:
          RUSTFLAGS: "-D warnings"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.tagName }}" ]; then
            cargo auditable build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: 📦 Build deb package
        if: contains(matrix.os, 'ubuntu')
        shell: bash
        run: |
          if [ -n "${{ inputs.tagName }}" ]; then
            cargo --locked auditable deb --no-build -p mdns-tui-browser --target ${{ matrix.target }}
          else
            cargo --locked deb --no-build -p mdns-tui-browser --target ${{ matrix.target }}
          fi
          # Rename deb to avoid conflicts between ubuntu-latest and ubuntu-22.04
          if [ "${{ matrix.os }}" = "ubuntu-22.04" ]; then
            cd "target/${{ matrix.target }}/debian" || exit 1
            for deb_file in *.deb; do
              [ -f "$deb_file" ] || continue
              new_name="${deb_file%.deb}-glibc2.35.deb"
              mv "$deb_file" "$new_name"
            done
          fi

      - name: 📦 Build archive
        shell: bash
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ -n "${{ inputs.tagName }}" ]; then
            VERSION_NAME="${{ inputs.tagName }}"
          else
            VERSION_NAME="$VERSION"
          fi
          # Use platform for tarball, but preserve original .deb name on Linux
          staging="mdns-tui-browser-${VERSION_NAME}-${{ matrix.platform }}"
          mkdir -p "$staging"
          cp LICENSE "$staging/"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/mdns-tui-browser.exe" "$staging/"
            cp "target/${{ matrix.target }}/release/mdns_tui_browser.pdb" "$staging/"
            7z a -tzip "$staging.zip" "$staging"
            echo "ASSET=$staging.zip" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/mdns-tui-browser" "$staging/"
            cp "target/${{ matrix.target }}/release/mdns-tui-browser.dwp" "$staging/" || true
            cp -LR "target/${{ matrix.target }}/release/mdns-tui-browser.dSYM" "$staging/" || true
            # Include manpage for Unix-like builds (Linux and macOS)
            if [[ "${{ matrix.os }}" == "ubuntu-latest" || "${{ matrix.os }}" == "macos-latest" ]]; then
              mkdir -p "$staging/man/man1"
              cp "docs/mdns-tui-browser.1" "$staging/man/man1/"
            fi
            tar czf "$staging.tar.gz" "$staging"
            echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"
            # Copy .deb file if it exists (Linux builds only)
            if find "target/${{ matrix.target }}/debian" -name '*.deb' -print -quit 2>/dev/null | grep -q .; then
              DEB_FILE=$(find "target/${{ matrix.target }}/debian" -name '*.deb' -print -quit)
              cp "$DEB_FILE" .
              DEB_NAME=$(basename "$DEB_FILE")
              echo "DEB_ASSET=$DEB_NAME" >> "$GITHUB_ENV"
              # Convert .deb to .ipk for aarch64 and armhf (OpenWrt)
              if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" || "${{ matrix.target }}" == "arm-unknown-linux-gnueabihf" ]]; then
                TEMP_DIR=$(mktemp -d)
                DEB_ABS_PATH="$GITHUB_WORKSPACE/$DEB_FILE"
                cp "$DEB_ABS_PATH" "$TEMP_DIR/"
                cd "$TEMP_DIR" || exit 1
                ar x "$(basename "$DEB_FILE")"
                # Discover actual archive filenames using pattern matching
                DATA_TAR=$(find . -name 'data.tar.*' -print -quit)
                CONTROL_TAR=$(find . -name 'control.tar.*' -print -quit)
                tar -xf "$DATA_TAR"
                tar -xf "$CONTROL_TAR"
                # Update control file for OpenWrt
                ARCH_MAP_ARM64="aarch64"
                ARCH_MAP_ARMHF="armv7ahf-vfp"
                if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
                  TARGET_ARCH="$ARCH_MAP_ARM64"
                else
                  TARGET_ARCH="$ARCH_MAP_ARMHF"
                fi
                sed -i "s/^Architecture: .*/Architecture: $TARGET_ARCH/" "$TEMP_DIR/control"
                sed -i 's/libgcc-s1/libgcc1/g' "$TEMP_DIR/control"
                # Create .ipk package - preserve control.tar.gz metadata
                mkdir -p "$TEMP_DIR/data"
                DATA_TAR=$(find . -name 'data.tar.*' -print -quit)
                tar -xf "$DATA_TAR" -C "$TEMP_DIR/data"
                cd "$TEMP_DIR/data" || exit 1
                tar -czf ../data.tar.gz .
                cd "$TEMP_DIR" || exit 1
                # Re-create control.tar.gz from extracted directory to preserve metadata
                mkdir -p tmp_control
                CONTROL_TAR=$(find . -name 'control.tar.*' -print -quit)
                tar -xf "$CONTROL_TAR" -C tmp_control
                sed -i "s/^Architecture: .*/Architecture: $TARGET_ARCH/" tmp_control/control
                sed -i 's/libgcc-s1/libgcc1/g' tmp_control/control
                tar -C tmp_control -czf control.tar.gz .
                ar cr "$TEMP_DIR/mdns-tui-browser_${VERSION_NAME}_${TARGET_ARCH}.ipk" debian-binary control.tar.gz data.tar.gz
                cp "$TEMP_DIR/mdns-tui-browser_${VERSION_NAME}_${TARGET_ARCH}.ipk" "$GITHUB_WORKSPACE/"
                echo "IPK_ASSET=mdns-tui-browser_${VERSION_NAME}_${TARGET_ARCH}.ipk" >> "$GITHUB_ENV"
                cd "$GITHUB_WORKSPACE" || exit 1
                rm -rf "$TEMP_DIR"
              fi
            fi
          fi

      - name: 🧮 Compute attestation subjects
        if: inputs.tagName && contains(matrix.os, 'ubuntu')
        shell: bash
        run: |
          if [ -n "${{ env.IPK_ASSET }}" ]; then
            echo "ATTESTATION_SUBJECTS=${{ env.ASSET }},${{ env.DEB_ASSET }},${{ env.IPK_ASSET }}" >> "$GITHUB_ENV"
          else
            echo "ATTESTATION_SUBJECTS=${{ env.ASSET }},${{ env.DEB_ASSET }}" >> "$GITHUB_ENV"
          fi

      - name: 🔐 Generate provenance attestation
        if: inputs.tagName
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: ${{ matrix.os == 'ubuntu-latest' && env.ATTESTATION_SUBJECTS || env.ASSET }}

      - name: 🚀 Publish release assets
        if: inputs.tagName
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: mDNS TUI Browser Release ${{ inputs.tagName }}
          tag_name: ${{ inputs.tagName }}
          append_body: true
          make_latest: false
          generate_release_notes: false
          files: |
            ${{ env.ASSET }}
            ${{ contains(matrix.os, 'ubuntu') && env.DEB_ASSET || '' }}
            ${{ matrix.os == 'ubuntu-latest' && (matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'arm-unknown-linux-gnueabihf') && env.IPK_ASSET || '' }}

      - name: 📦 Upload artifacts
        if: (!inputs.tagName)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mdns-tui-browser-${{ matrix.platform }}${{ matrix.target && '-' || '' }}${{ matrix.target || '' }}
          path: ${{ env.ASSET }}
          retention-days: 30

      - name: 📦 Upload deb artifacts
        if: (!inputs.tagName) && contains(matrix.os, 'ubuntu') && env.DEB_ASSET != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mdns-tui-browser-${{ matrix.target }}-deb${{ matrix.os == 'ubuntu-22.04' && '-glibc2.35' || '' }}
          path: ${{ env.DEB_ASSET }}
          retention-days: 30

      - name: 📦 Upload ipk artifacts
        if: (!inputs.tagName) && matrix.os == 'ubuntu-latest' && (matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'arm-unknown-linux-gnueabihf') && env.IPK_ASSET != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mdns-tui-browser-${{ matrix.target }}-ipk
          path: ${{ env.IPK_ASSET }}
          retention-days: 30
