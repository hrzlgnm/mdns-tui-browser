name: "Reusable build workflow"

on:
  workflow_call:
    inputs:
      branch:
        required: false
        type: string
        default: ""
      tagName:
        required: false
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "ubuntu-22.04"
            symbol: 🐧 x86_64 glibc-2.35
            target: x86_64-unknown-linux-gnu
            platform: Linux-x86_64-glibc-2.35
          - os: "ubuntu-latest"
            symbol: 🐧 x86_64 latest
            target: x86_64-unknown-linux-gnu
            platform: Linux-x86_64
          - os: "ubuntu-latest"
            symbol: 🐧 aarch64 latest
            target: aarch64-unknown-linux-gnu
            platform: Linux-aarch64
            dependencies: |
              sudo apt-get update
              sudo apt-get -y install gcc-aarch64-linux-gnu
          - os: "ubuntu-latest"
            symbol: 🐧 arm latest
            target: arm-unknown-linux-gnueabihf
            platform: Linux-arm
            dependencies: |
              sudo apt-get update
              sudo apt-get -y install gcc-arm-linux-gnueabihf
          - os: "macos-latest"
            symbol: 🍏 aarch64 latest
            target: aarch64-apple-darwin
            platform: macOS-aarch64
          - os: "macos-latest"
            symbol: 🍏 x86_64 latest
            target: x86_64-apple-darwin
            platform: macOS-x86_64
          - os: "windows-latest"
            symbol: 🪟 x86_64 latest
            platform: Windows-x86_64
            target: x86_64-pc-windows-msvc

    name: ${{matrix.symbol}}🔨
    runs-on: ${{matrix.os}}
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: ${{ inputs.tagName && '0' || '1' }}
          ref: ${{ inputs.tagName || '' }}

      - name: 📜 Create and 🔍 scan SBOM for vulnerabilities
        uses: ./.github/actions/sbom
        with:
          artifact-name: "sbom.${{ matrix.platform }}.spdx.json"

      - name: 📜 Copy SBOM for release
        if: inputs.tagName
        shell: bash
        run: |
          cp sbom.spdx.json "sbom.spdx-${{ matrix.platform }}.json"
          echo "PLATFORM_SBOM=sbom.spdx-${{ matrix.platform }}.json" >> "$GITHUB_ENV"

      - name: 🦀🚀
        uses: ./.github/actions/setup-rust-cache
        with:
          targets: ${{ matrix.target }}
          save-cache: ${{ inputs.branch == 'main' }}

      - name: 🛠️🔐 cargo-auditable
        if: inputs.tagName
        uses: baptiste0928/cargo-install@f204293d9709061b7bc1756fec3ec4e2cd57dec0 # v3
        with:
          crate: cargo-auditable
          version: 0.7.5
          locked: true

      - name: 🛠️📦 cargo-deb
        if: contains(matrix.os, 'ubuntu')
        uses: baptiste0928/cargo-install@f204293d9709061b7bc1756fec3ec4e2cd57dec0 # v3
        with:
          crate: cargo-deb
          version: 3.7.0
          locked: true

      - name: 🛠️ dependencies
        if: matrix.dependencies
        shell: bash
        run: |
          ${{ matrix.dependencies }}

      - name: 🛠️🚀
        if: (!inputs.tagName)
        uses: ./.github/actions/setup-sccache

      - name: 🔨 Build release binary
        shell: bash
        env:
          RUSTFLAGS: "-D warnings"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.tagName }}" ]; then
            cargo auditable build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: 📦 Build deb package
        if: contains(matrix.os, 'ubuntu')
        shell: bash
        run: |
          if [ -n "${{ inputs.tagName }}" ]; then
            cargo --locked auditable deb --no-build -p mdns-tui-browser --target ${{ matrix.target }}
          else
            cargo --locked deb --no-build -p mdns-tui-browser --target ${{ matrix.target }}
          fi
          # Rename deb to avoid conflicts between ubuntu-latest and ubuntu-22.04
          if [ "${{ matrix.os }}" = "ubuntu-22.04" ]; then
            cd "target/${{ matrix.target }}/debian" || exit 1
            for deb_file in *.deb; do
              [ -f "$deb_file" ] || continue
              new_name="${deb_file%.deb}-glibc2.35.deb"
              mv "$deb_file" "$new_name"
            done
          fi

      - name: 📦 Build archive
        shell: bash
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ -n "${{ inputs.tagName }}" ]; then
            VERSION_NAME="${{ inputs.tagName }}"
          else
            VERSION_NAME="$VERSION"
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          # Use platform for tarball, but preserve original .deb name on Linux
          staging="mdns-tui-browser-${VERSION_NAME}-${{ matrix.platform }}"
          mkdir -p "$staging"
          cp LICENSE "$staging/"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/mdns-tui-browser.exe" "$staging/"
            cp "target/${{ matrix.target }}/release/mdns_tui_browser.pdb" "$staging/"
            7z a -tzip "$staging.zip" "$staging"
            echo "ASSET=$staging.zip" >> "$GITHUB_ENV"
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            cp "target/${{ matrix.target }}/release/mdns-tui-browser" "$staging/"
            cp "target/${{ matrix.target }}/release/mdns-tui-browser.dwp" "$staging/" || true
            cp -LR "target/${{ matrix.target }}/release/mdns-tui-browser.dSYM" "$staging/" || true
            mkdir -p "$staging/man/man1"
            cp "docs/mdns-tui-browser.1" "$staging/man/man1/"
            tar czf "$staging.tar.gz" "$staging"
            echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/mdns-tui-browser" "$staging/"
            cp "target/${{ matrix.target }}/release/mdns-tui-browser.dwp" "$staging/" || true
            cp -LR "target/${{ matrix.target }}/release/mdns-tui-browser.dSYM" "$staging/" || true
            # Include manpage for Linux builds only
            if [[ "${{ matrix.os }}" =~ ^ubuntu ]]; then
              mkdir -p "$staging/man/man1"
              cp "docs/mdns-tui-browser.1" "$staging/man/man1/"
            fi
            tar czf "$staging.tar.gz" "$staging"
            echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"
            # Copy .deb file if it exists (Linux builds only)
            if find "target/${{ matrix.target }}/debian" -name '*.deb' -print -quit 2>/dev/null | grep -q .; then
              DEB_FILE=$(find "target/${{ matrix.target }}/debian" -name '*.deb' -print -quit)
              cp "$DEB_FILE" .
              DEB_NAME=$(basename "$DEB_FILE")
              echo "DEB_ASSET=$DEB_NAME" >> "$GITHUB_ENV"
              # Convert .deb to .ipk for aarch64 and armhf (OpenWrt)
              if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" || "${{ matrix.target }}" == "arm-unknown-linux-gnueabihf" ]]; then
                TEMP_DIR=$(mktemp -d)
                DEB_ABS_PATH="$GITHUB_WORKSPACE/$DEB_FILE"
                cp "$DEB_ABS_PATH" "$TEMP_DIR/"
                cd "$TEMP_DIR" || exit 1
                ar x "$(basename "$DEB_FILE")"
                # Discover actual archive filenames using pattern matching
                DATA_TAR=$(find . -name 'data.tar.*' -print -quit)
                CONTROL_TAR=$(find . -name 'control.tar.*' -print -quit)
                tar -xf "$DATA_TAR"
                tar -xf "$CONTROL_TAR"
                # Update control file for OpenWrt
                ARCH_MAP_ARM64="aarch64"
                ARCH_MAP_ARMHF="armv7ahf-vfp"
                if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
                  TARGET_ARCH="$ARCH_MAP_ARM64"
                else
                  TARGET_ARCH="$ARCH_MAP_ARMHF"
                fi
                sed -i "s/^Architecture: .*/Architecture: $TARGET_ARCH/" "$TEMP_DIR/control"
                sed -i 's/libgcc-s1/libgcc1/g' "$TEMP_DIR/control"
                # Create .ipk package - preserve control.tar.gz metadata
                mkdir -p "$TEMP_DIR/data"
                DATA_TAR=$(find . -name 'data.tar.*' -print -quit)
                tar -xf "$DATA_TAR" -C "$TEMP_DIR/data"
                cd "$TEMP_DIR/data" || exit 1
                tar -czf ../data.tar.gz .
                cd "$TEMP_DIR" || exit 1
                # Re-create control.tar.gz from extracted directory to preserve metadata
                mkdir -p tmp_control
                CONTROL_TAR=$(find . -name 'control.tar.*' -print -quit)
                tar -xf "$CONTROL_TAR" -C tmp_control
                sed -i "s/^Architecture: .*/Architecture: $TARGET_ARCH/" tmp_control/control
                sed -i 's/libgcc-s1/libgcc1/g' tmp_control/control
                tar -C tmp_control -czf control.tar.gz .
                ar cr "$TEMP_DIR/mdns-tui-browser_${VERSION_NAME}_${TARGET_ARCH}.ipk" debian-binary control.tar.gz data.tar.gz
                cp "$TEMP_DIR/mdns-tui-browser_${VERSION_NAME}_${TARGET_ARCH}.ipk" "$GITHUB_WORKSPACE/"
                echo "IPK_ASSET=mdns-tui-browser_${VERSION_NAME}_${TARGET_ARCH}.ipk" >> "$GITHUB_ENV"
                cd "$GITHUB_WORKSPACE" || exit 1
                rm -rf "$TEMP_DIR"
              fi
            fi
          fi

      - name: 🛠️ Install create-dmg
        if: contains(matrix.os, 'macos')
        run: |
          CREATE_DMG_VERSION="v1.1.0"
          git clone --depth 1 --branch "$CREATE_DMG_VERSION" https://github.com/create-dmg/create-dmg.git /tmp/create-dmg
          cd /tmp/create-dmg
          make
          sudo cp create-dmg /usr/local/bin/
          cd -
          rm -rf /tmp/create-dmg

      - name: 📦 Build DMG
        if: contains(matrix.os, 'macos')
        shell: bash
        run: |
          DMG_STAGING="mdns-tui-browser-dmg-${VERSION_NAME}-${{ matrix.platform }}"
          APP_NAME="mDNS-TUI-Browser.app"
          DMG_NAME="mdns-tui-browser-${VERSION_NAME}-${{ matrix.platform }}.dmg"
          mkdir -p "$DMG_STAGING/$APP_NAME/Contents/MacOS"
          mkdir -p "$DMG_STAGING/$APP_NAME/Contents/Resources"
          cp "target/${{ matrix.target }}/release/mdns-tui-browser" "$DMG_STAGING/$APP_NAME/Contents/MacOS/"
          cp LICENSE "$DMG_STAGING/$APP_NAME/Contents/Resources/"
          # Create a shell script wrapper that launches Terminal with the TUI app
          cat > "$DMG_STAGING/$APP_NAME/Contents/MacOS/run" << 'WRAPPER'
          #!/bin/bash
          EXE_PATH="$(cd "$(dirname "$0")" && pwd)/mdns-tui-browser"
          osascript -e 'tell app "Terminal"' -e "do script \"$EXE_PATH; exit\"" -e 'end tell'
          WRAPPER
          chmod +x "$DMG_STAGING/$APP_NAME/Contents/MacOS/run"
          # Set the wrapper as the executable in Info.plist
          cat > "$DMG_STAGING/$APP_NAME/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>run</string>
            <key>CFBundleIdentifier</key>
            <string>com.mdns-tui-browser.app</string>
            <key>CFBundleName</key>
            <string>mDNS TUI Browser</string>
            <key>CFBundleVersion</key>
            <string>${VERSION_NAME}</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION_NAME}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>10.13</string>
            <key>LSApplicationCategoryType</key>
            <string>public.app-category.utilities</string>
            <key>LSBackgroundOnly</key>
            <true/>
          </dict>
          </plist>
          EOF
          # Self-sign the app bundle before packaging into DMG
          codesign --force --deep --sign - "$DMG_STAGING/$APP_NAME"
          create-dmg --volname "mDNS TUI Browser" \
                    --window-pos 200 120 \
                    --window-size 600 400 \
                    --icon-size 100 \
                    --icon "$APP_NAME" 150 150 \
                    --app-drop-link 425 150 \
                    "$DMG_NAME" \
                    "$DMG_STAGING/"
          # Self-sign the DMG (the app inside was already signed during build)
          codesign --force --sign - "$DMG_NAME"
          # Clean up DMG staging
          rm -rf "$DMG_STAGING"
          echo "DMG_ASSET=$DMG_NAME" >> "$GITHUB_ENV"

      - name: 🧮 Compute attestation subjects
        if: inputs.tagName && (contains(matrix.os, 'ubuntu') || contains(matrix.os, 'macos'))
        shell: bash
        run: |
          if [ -n "${{ env.IPK_ASSET }}" ]; then
            echo "ATTESTATION_SUBJECTS=${{ env.ASSET }},${{ env.DEB_ASSET }},${{ env.IPK_ASSET }}" >> "$GITHUB_ENV"
          elif [ -n "${{ env.DMG_ASSET }}" ]; then
            echo "ATTESTATION_SUBJECTS=${{ env.ASSET }},${{ env.DMG_ASSET }}" >> "$GITHUB_ENV"
          elif [ -n "${{ env.DEB_ASSET }}" ]; then
            echo "ATTESTATION_SUBJECTS=${{ env.ASSET }},${{ env.DEB_ASSET }}" >> "$GITHUB_ENV"
          else
            echo "ATTESTATION_SUBJECTS=${{ env.ASSET }}" >> "$GITHUB_ENV"
          fi

      - name: 🛡️ Attest SBOM
        if: inputs.tagName
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: ${{ contains(matrix.os, 'windows') && format('target/{0}/release/mdns-tui-browser.exe', matrix.target) || format('target/{0}/release/mdns-tui-browser', matrix.target) }}
          sbom-path: "sbom.spdx.json"

      - name: 🔐 Generate provenance attestation
        if: inputs.tagName
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: ${{ (contains(matrix.os, 'ubuntu') || contains(matrix.os, 'macos')) && env.ATTESTATION_SUBJECTS || env.ASSET }}

      - name: 🚀 Publish release assets
        if: inputs.tagName
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: mDNS TUI Browser Release ${{ inputs.tagName }}
          tag_name: ${{ inputs.tagName }}
          append_body: true
          make_latest: false
          generate_release_notes: false
          files: |
            ${{ env.ASSET }}
            ${{ contains(matrix.os, 'ubuntu') && env.DEB_ASSET || '' }}
            ${{ matrix.os == 'ubuntu-latest' && (matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'arm-unknown-linux-gnueabihf') && env.IPK_ASSET || '' }}
            ${{ contains(matrix.os, 'macos') && env.DMG_ASSET || '' }}
            ${{ inputs.tagName && env.PLATFORM_SBOM || '' }}

      - name: 📦 Upload artifacts
        if: (!inputs.tagName)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mdns-tui-browser-${{ matrix.platform }}${{ matrix.target && '-' || '' }}${{ matrix.target || '' }}
          path: ${{ env.ASSET }}
          retention-days: 30

      - name: 📦 Upload deb artifacts
        if: (!inputs.tagName) && contains(matrix.os, 'ubuntu') && env.DEB_ASSET != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mdns-tui-browser-${{ matrix.target }}-deb${{ matrix.os == 'ubuntu-22.04' && '-glibc2.35' || '' }}
          path: ${{ env.DEB_ASSET }}
          retention-days: 30

      - name: 📦 Upload ipk artifacts
        if: (!inputs.tagName) && matrix.os == 'ubuntu-latest' && (matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'arm-unknown-linux-gnueabihf') && env.IPK_ASSET != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mdns-tui-browser-${{ matrix.target }}-ipk
          path: ${{ env.IPK_ASSET }}
          retention-days: 30

      - name: 📦 Upload DMG artifacts
        if: (!inputs.tagName) && contains(matrix.os, 'macos') && env.DMG_ASSET != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mdns-tui-browser-${{ matrix.target }}-dmg
          path: ${{ env.DMG_ASSET }}
          retention-days: 30

      - name: 📦 Upload SBOM artifact
        if: (!inputs.tagName)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.platform }}
          path: sbom.spdx.json
          retention-days: 30
