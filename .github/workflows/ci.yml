name: "CI"

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  # measure against bitrot
  # also rotates docker images monthly, by pushing new docker images
  # the rotation will happen by renovate
  # rotate the images in the middle of the month,
  # to avoid duplicate rotations at the beginning of the month,
  # as the source docker images are also mostly rotated once a month
  schedule:
    - cron: "0 0 15 * *"

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

permissions:
  contents: read # Minimal default needed for change detection

concurrency:
  # On main, we want all builds to complete even if merging happens faster to make it easier to discover at which point something broke.
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  label-pr:
    if: github.event_name == 'pull_request'
    name: "🏷️ Label PR"
    permissions:
      contents: read # Needed to read repository contents
      pull-requests: write # Needed to apply labels
      issues: write # Needed to create non existing labels
    runs-on: ubuntu-slim

    steps:
      - uses: actions/labeler@634933edcd8ababfe52f92936142cc22ac488b1b # v6.0.1
        with:
          configuration-path: .github/labeler.yml

  changes:
    name: "🔍 Detect Changes"
    runs-on: ubuntu-slim
    outputs:
      actionlint: ${{ steps.filter.outputs.actionlint }}
      aur: ${{ steps.filter.outputs.aur }}
      branch: ${{ steps.branch.outputs.branch }}
      code: ${{ steps.filter.outputs.code }}
      lint: ${{ steps.filter.outputs.lint }}
      tests: ${{ steps.filter.outputs.tests }}
      winget: ${{ steps.filter.outputs.winget }}
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: 🔍 Check for changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            actionlint:
              - '.github/workflows/*.yml'
              - '.github/actions/*/action.yml'
            aur:
              - '.github/workflows/aur-reusable.yml'
              - '.github/actions/latest-release-info/action.yml'
              - 'packaging/aur/**'
              
            code:
              - '.github/actions/setup-*/**'
              - '.github/workflows/build-reusable.yml'
              - 'src/**'
              - 'src-tauri/Cargo.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
            lint:
              - '.github/workflows/lint-reusable.yml'
            tests:
              - '.github/workflows/test-reusable.yml'
              - '.config/nextest.toml'
            winget:
              - '.github/workflows/winget-reusable.yml'
              - '.github/actions/latest-release-info/action.yml'
      - name: Output branch name
        id: branch
        run: |
          echo "branch=${{ env.BRANCH_NAME }}" >> "$GITHUB_OUTPUT"

  typos:
    name: 📝 Check typos
    if: always()
    uses: hrzlgnm/actions/.github/workflows/typos-reusable.yml@b7ab1ef891238940cc59c77a49a62f2e8258bd86 # v2.0.5

  actionlint:
    name: "🔍 Validate Workflows"
    needs: changes
    runs-on: ubuntu-latest
    container: ghcr.io/hrzlgnm/mdns-browser-arch-aur-builder:v1@sha256:b11278a0c923991e3940845efe5aeed0967dd51c31d50d16d877efcc2a1ee7a4
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: 📋 Determine actionlint result
        id: actionlint_check
        run: |
          if [[ "${{ needs.changes.outputs.actionlint }}" == "true" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🔍 Validate workflows
        if: steps.actionlint_check.outputs.should_run == 'true'
        run: |
          actionlint .github/workflows/*.yml

  lint:
    permissions:
      contents: read
    needs:
      - changes
      - actionlint
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.lint == 'true'
    uses: ./.github/workflows/lint-reusable.yml

  tests:
    permissions:
      contents: read # Needed to checkout code for testing
      checks: write # Required for action-junit-report annotation
    needs:
      - changes
      - actionlint
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.tests == 'true'
    uses: ./.github/workflows/test-reusable.yml

  build:
    name: "build"
    needs:
      - changes
      - actionlint
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read # Needed to run build and pass permissions to reusable workflow
    uses: ./.github/workflows/build-reusable.yml
    secrets: inherit
    with:
      branch: ${{ needs.changes.outputs.branch }}

  aur:
    name: AUR
    needs:
      - changes
      - actionlint
    if: needs.changes.outputs.aur == 'true'
    permissions:
      contents: read # Needed to checkout code and run local scripts for AUR build
      packages: read # Needed to read container image for AUR build
    uses: ./.github/workflows/aur-reusable.yml

  winget:
    name: winget
    needs:
      - changes
      - actionlint
    if: needs.changes.outputs.winget == 'true'
    permissions:
      contents: read # Needed to download release assets for winget submission
    uses: ./.github/workflows/winget-reusable.yml
    secrets: inherit

  cache-tools:
    needs:
      - build
      - lint
      - tests
    name: "📦 Cache tools"
    if: always() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    permissions:
      contents: read # Needed to checkout code for caching tools
    uses: ./.github/workflows/cache-tools-reusable.yml

  all-required-green: # This job does nothing and is only used for the branch protection
    name: CI Status
    runs-on: ubuntu-latest
    needs:
      - actionlint
      - aur
      - build
      - lint
      - tests
      - typos
      - winget
      - cache-tools
    if: always()
    steps:
      - name: Check whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@a638d6464689bbb24c325bb3fe9404d63a913030
        with:
          allowed-skips: >-
            aur,
            lint,
            tests,
            build,
            winget,
            cache-tools,
          jobs: ${{ toJSON(needs) }}
