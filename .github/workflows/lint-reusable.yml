name: "Reusable ci lint workflow"

on:
  workflow_call:
  workflow_dispatch:

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 🦀🚀
        uses: ./.github/actions/setup-rust-cache
        with:
          components: rustfmt

      - name: 📐 Run rustfmt and fail if any warnings
        shell: bash
        run: |
          cargo fmt -- --check

  clippy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "ubuntu-latest"
            symbol: 🐧
            platform: Linux
          # macOS runners are scarce: type-check the macOS cfg code on
          # Linux. No C is compiled for Apple targets and nothing links,
          # so no Apple SDK is needed.
          - os: "ubuntu-latest"
            symbol: 🍏
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: "windows-latest"
            symbol: 🪟
    runs-on: ${{matrix.os}}
    name: ${{matrix.symbol}}📎
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 🦀🚀
        uses: ./.github/actions/setup-rust-cache
        with:
          components: clippy
          targets: ${{ matrix.targets || '' }}

      # Clippy emits metadata only, which sccache cannot cache.
      - name: 📎 Run clippy and fail if any warnings
        shell: bash
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          target_args=()
          IFS=',' read -ra targets <<<"$TARGETS"
          for t in "${targets[@]}"; do target_args+=(--target "$t"); done
          cargo clippy --tests "${target_args[@]}" -- -D warnings
