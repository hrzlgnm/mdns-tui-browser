name: Publish release artifacts

on:
  workflow_dispatch:
    inputs:
      tagName:
        description: "Tag name to publish"
        required: true
        type: string
  release:
    types:
      - published
      - prereleased

jobs:
  source:
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/source-checksums-reusable.yml
    secrets: inherit
    with:
      tagName: ${{ github.event.inputs.tagName || github.event.release.tag_name }}

  build:
    permissions:
      id-token: write
      attestations: write
      contents: write
      actions: read
    uses: ./.github/workflows/build-reusable.yml
    secrets: inherit
    with:
      tagName: ${{ github.event.inputs.tagName || github.event.release.tag_name }}
