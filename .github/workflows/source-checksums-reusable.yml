name: Create and publish source checksum
on:
  workflow_call:
    inputs:
      tagName:
        description: The tag name of the release to publish for
        type: string
        required: true
  workflow_dispatch:
    inputs:
      semver:
        description: The semver of the release to publish for
        type: string
        required: true

permissions:
  contents: write # Needed to upload checksums and publish release assets

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-slim
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: 🏷️
        id: tag
        env:
          EVENT_NAME: ${{ github.event.release.name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tagName }}
          INPUT_SEMVER: ${{ inputs.semver }}
        run: |
          if [ -n "$EVENT_NAME" ]; then
            echo "tag=$EVENT_TAG" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_SEMVER" ]; then
            echo "tag=v$INPUT_SEMVER" >> "$GITHUB_OUTPUT"
          else
            echo "Error: No tag information available"
            exit 1
          fi

  generate_checksums:
    name: 🔢☑️
    runs-on: ubuntu-slim
    needs:
      - tag
    strategy:
      matrix:
        algorithm: [sha256]
    steps:
      - name: 📥🔢☑️
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          ALGORITHM: ${{ matrix.algorithm }}
        run: |
          set -o errexit

           ALLOWED_ALGORITHMS="sha256 sha512 sha1 md5"
           case "$ALGORITHM" in
             sha256|sha512|sha1|md5)
               # Valid algorithm
               ;;
             *)
               echo "Error: ALGORITHM '$ALGORITHM' is not in the allowlist: $ALLOWED_ALGORITHMS"
               exit 1
               ;;
           esac

          CMD="${ALGORITHM}sum"

          curl -sfLO "https://github.com/hrzlgnm/mdns-tui-browser/archive/refs/tags/${TAG}.tar.gz"
          curl -sfLO "https://github.com/hrzlgnm/mdns-tui-browser/archive/refs/tags/${TAG}.zip"
          for file in *; do
            if [ -f "$file" ] && [[ ! "$file" =~ \.sha ]]; then
              "$CMD" "$file" > "$file.$ALGORITHM"
            fi
          done
      - name: 📤
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: ${{ matrix.algorithm }}-source-checksums
          path: "*.${{ matrix.algorithm }}"

  publish:
    name: 📰🔢☑️
    runs-on: ubuntu-slim
    needs:
      - tag
      - generate_checksums
    steps:
      - name: 📥 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8

      - name: 📰🔢☑️
        uses: softprops/action-gh-release@71d29a04ae7c63895f38299d7a5e05d238f7f445 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          append_body: true
          make_latest: false
          generate_release_notes: false
          files: |
            **/*.sha*
