name: Create and publish source checksum
on:
  workflow_call:
    inputs:
      tagName:
        description: The tag name of the release to publish for
        type: string
        required: true
  workflow_dispatch:
    inputs:
      semver:
        description: The semver of the release to publish for
        type: string
        required: true

permissions:
  contents: write # Needed to upload checksums and publish release assets

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-slim
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: 🏷️
        id: tag
        env:
          EVENT_NAME: ${{ github.event.release.name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tagName }}
          INPUT_SEMVER: ${{ inputs.semver }}
        run: |
          if [ -n "$EVENT_NAME" ]; then
            echo "tag=$EVENT_TAG" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_SEMVER" ]; then
            echo "tag=v$INPUT_SEMVER" >> "$GITHUB_OUTPUT"
          else
            echo "Error: No tag information available"
            exit 1
          fi

  checksums:
    name: 🔢☑️ ${{ matrix.algorithm }}
    runs-on: ubuntu-slim
    needs:
      - tag
    strategy:
      matrix:
        algorithm: [sha256]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 📥 Download source archive
        uses: hrzlgnm/actions/.github/actions/retry@dc057d6ab047f38c862870e90c81a192d24ca92e # v2.11.0
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        with:
          command: |
            curl -f -sL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 15 -O "https://github.com/hrzlgnm/mdns-tui-browser/archive/refs/tags/${TAG}.tar.gz"
            curl -f -sL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 15 -O "https://github.com/hrzlgnm/mdns-tui-browser/archive/refs/tags/${TAG}.zip"

      - name: 🔢 Compute ${{ matrix.algorithm }} checksums
        uses: hrzlgnm/actions/.github/actions/retry@dc057d6ab047f38c862870e90c81a192d24ca92e # v2.11.0
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          ALGORITHM: ${{ matrix.algorithm }}
        with:
          command: |
            set -o errexit

            ALLOWED_ALGORITHMS="sha256 sha512 sha1 md5"
            case "$ALGORITHM" in
              sha256|sha512|sha1|md5)
                # Valid algorithm
                ;;
              *)
                echo "Error: ALGORITHM '$ALGORITHM' is not in the allowlist: $ALLOWED_ALGORITHMS"
                exit 1
                ;;
            esac

            CMD="${ALGORITHM}sum"

            for file in *.tar.gz *.zip; do
              [ -f "$file" ] || continue
              "$CMD" "$file" > "$file.$ALGORITHM"
            done

      - name: 📰 Upload checksums to release
        uses: hrzlgnm/actions/.github/actions/retry@dc057d6ab047f38c862870e90c81a192d24ca92e # v2.11.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag.outputs.tag }}
          ALGORITHM: ${{ matrix.algorithm }}
        with:
          command: |
            CHECKSUMS=()
            while IFS= read -r -d '' file; do
              CHECKSUMS+=("$file")
            done < <(find . -type f -name "*.${ALGORITHM}" -print0)
            if [ "${#CHECKSUMS[@]}" -eq 0 ]; then
              echo "No checksum files to upload"
              exit 1
            fi
            gh release upload "$TAG" "${CHECKSUMS[@]}" --clobber --repo "$GITHUB_REPOSITORY"
