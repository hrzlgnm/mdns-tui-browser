name: Create and publish source checksum
on:
  workflow_call:
    inputs:
      tagName:
        description: The tag name of the release to publish for
        type: string
        required: true
  workflow_dispatch:
    inputs:
      semver:
        description: The semver of the release to publish for
        type: string
        required: true

permissions:
  contents: write

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-slim
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: 🏷️
        id: tag
        env:
          EVENT_NAME: ${{ github.event.release.name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tagName }}
          INPUT_SEMVER: ${{ inputs.semver }}
        run: |
          if [ -n "$EVENT_NAME" ]; then
            echo "tag=$EVENT_TAG" >> $GITHUB_OUTPUT
          elif [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> $GITHUB_OUTPUT
          elif [ -n "$INPUT_SEMVER" ]; then
            echo "tag=v$INPUT_SEMVER" >> $GITHUB_OUTPUT
          else
            echo "Error: No tag information available"
            exit 1
          fi

  generate_checksums:
    name: 🔢☑️
    runs-on: ubuntu-slim
    needs:
      - tag
    strategy:
      matrix:
        algorithm: [sha256]
    steps:
      - name: 📥🔢☑️
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          ALGORITHM: ${{ matrix.algorithm }}
        run: |
          set -o errexit
          
          ALLOWED_ALGORITHMS="sha256 sha512 sha1 md5"
          if [[ ! " $ALLOWED_ALGORITHMS " =~ " $ALGORITHM " ]]; then
            echo "Error: ALGORITHM '$ALGORITHM' is not in the allowlist: $ALLOWED_ALGORITHMS"
            exit 1
          fi
          
          CMD="${ALGORITHM}sum"
          
          curl -sfLO https://github.com/hrzlgnm/mdns-tui-browser/archive/refs/tags/${TAG}.tar.gz
          curl -sfLO https://github.com/hrzlgnm/mdns-tui-browser/archive/refs/tags/${TAG}.zip
          for file in *; do
            if [ -f "$file" ] && [[ "$file" != *.sha* ]]; then
              "$CMD" "$file" > "$file.$ALGORITHM"
            fi
          done
      - name: 📤
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.algorithm }}-source-checksums
          path: "*.${{ matrix.algorithm }}"

  publish:
    name: 📰🔢☑️
    runs-on: ubuntu-slim
    needs:
      - tag
      - generate_checksums
    steps:
      - name: 📥 artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7

      - name: 📰🔢☑️
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          append_body: true
          make_latest: false
          generate_release_notes: false
          files: |
            **/*.sha*
