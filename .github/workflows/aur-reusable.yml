name: Arch linux AUR

on:
  workflow_call:
  workflow_dispatch:
  release:
    types: [released]

jobs:
  release-info:
    permissions:
      packages: read
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.version.outputs.version }}
      tagName: ${{ steps.version.outputs.tagName }}
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🏷️ Get version info
        id: version
        uses: ./.github/actions/latest-release-info

  lint-scripts:
    name: "🧹 Lint shell scripts"
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: 📥 Install pinned lint tools
        uses: hrzlgnm/actions/.github/actions/retry@d2c23efb5ed3a9f91dd4b2b898db20aeb5aa788f # v2.9.0
        with:
          # Downloads only; the lint below stays plain so a real
          # finding fails fast instead of being retried.
          command: ./packaging/aur/install-lint-tools.sh
      - name: 🧹 Check shell scripts
        env:
          SCRIPTS_DIR: packaging/aur
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          shellcheck -S warning "$SCRIPTS_DIR"/*.sh
          shfmt --diff --indent 4 --case-indent --binary-next-line "$SCRIPTS_DIR"/*.sh

  update-aur:
    needs:
      - release-info
      - lint-scripts
    permissions:
      packages: read
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hrzlgnm/mdns-browser-arch-aur-builder:v1@sha256:d344e8162f5bcf9bb52750adee123f17eeaa565138bf75096b58e97bad00db0e
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: mdns-tui-browser
            checksum_url: "https://github.com/hrzlgnm/mdns-tui-browser/releases/download/${{ needs.release-info.outputs.tagName }}/${{ needs.release-info.outputs.version }}.tar.gz.sha256"
            generate_script: "./packaging/aur/generate-mdns-tui-browser.sh"
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🔢 Get sha256sums
        id: sha256sums
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          CHECKSUM_URL: ${{ matrix.package.checksum_url }}
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 10
          warning_on_retry: true
          command: ./packaging/aur/resolve-sha256.sh

      - name: 📐 Lint generated PKGBUILD
        env:
          VERSION: ${{ needs.release-info.outputs.version }}
          SHA256: ${{ steps.sha256sums.outputs.sha256 }}
          GENERATE_SCRIPT: ${{ matrix.package.generate_script }}
        shell: bash
        # su without --login keeps the step env and only resets
        # HOME/SHELL/USER/LOGNAME, so the script reads inputs from env.
        run: su runner -c "./packaging/aur/lint-pkgbuild.sh"

      - name: 🛠️ Setup Deployment keys
        if: github.event.release.tag_name
        uses: hrzlgnm/actions/.github/actions/retry@d2c23efb5ed3a9f91dd4b2b898db20aeb5aa788f # v2.9.0
        env:
          AUR_DEPLOY_KEY: ${{ secrets.AUR_DEPLOY_KEY }}
        with:
          command: ./packaging/aur/fix-ownership.sh && su runner -c "./packaging/aur/setup-aur-ssh.sh"

      - name: 🔄 Clone AUR Repo
        if: github.event.release.tag_name
        shell: bash
        env:
          PACKAGE_NAME: ${{ matrix.package.name }}
        run: su runner -c "./packaging/aur/clone-aur-repo.sh"

      - name: 🔍 Check version
        if: github.event.release.tag_name
        env:
          RELEASE_VERSION: ${{ needs.release-info.outputs.version }}
        shell: bash
        run: su runner -c "./packaging/aur/check-aur-version.sh"

      - name: 🌀 Generate PKGBUILD update and publish
        if: github.event.release.tag_name
        env:
          VERSION: ${{ needs.release-info.outputs.version }}
          SHA256: ${{ steps.sha256sums.outputs.sha256 }}
          GENERATE_SCRIPT: ${{ matrix.package.generate_script }}
        run: su runner -c "./packaging/aur/publish-aur.sh"
