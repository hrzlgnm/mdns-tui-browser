name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      dry-run:
        description: dry-run
        required: true
        type: boolean
        default: false

jobs:
  release:
    permissions:
      actions: write # to trigger other actions and workflow dispatch
      contents: write # to update version and create tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.semantic-version }}
    env:
      GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
      RULESET: repos/${{ github.repository }}/rulesets/12155739
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: 🦀🚀
        uses: ./.github/actions/setup-rust-cache
        with:
          save-cache: false

      - name: 🛠️🚀 cargo-edit
        uses: baptiste0928/cargo-install@b687c656bda5733207e629b50a22bf68974a0305 # v3
        with:
          crate: cargo-edit
          version: 0.13.8
          locked: true

      - name: 📦 Bump version in Cargo.toml
        id: version
        run: |
          CURRENT_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            # Parse version and calculate next version without semver tool
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            case "${{ inputs.version }}" in
              "patch")
                NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
                ;;
              "minor")
                NEW_VERSION="$MAJOR.$((MINOR + 1)).0"
                ;;
              "major")
                NEW_VERSION="$((MAJOR + 1)).0.0"
                ;;
              *)
                echo "Error: Invalid version bump type '${{ inputs.version }}'. Must be patch, minor, or major."
                exit 1
                ;;
            esac
            echo "semantic-version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "Dry run: would bump from $CURRENT_VERSION to $NEW_VERSION"
          else
            cargo set-version --bump ${{ inputs.version }}
            NEW_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
            echo "semantic-version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "Bumped version from $CURRENT_VERSION to $NEW_VERSION"
          fi

      - name: ⚙️Set up SSH signing key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_SIGNING_KEY }}" > ~/.ssh/id_ed25519_signing
          chmod 600 ~/.ssh/id_ed25519_signing
          git config --global gpg.format ssh
          git config --global user.signingKey ~/.ssh/id_ed25519_signing
          git config --global user.name "hrzlgnm"
          git config --global user.email "hrzlgnm@users.noreply.github.com"

      - name: 🔐 Update Cargo.lock
        if: ${{ !inputs.dry-run }}
        run: |
          cargo check --locked

      - name: ⏳ Temporary disable ruleset enforcement
        if: ${{ !inputs.dry-run }}
        run: |
          gh api \
          -H "Accept: application/vnd.github+json" \
          ${RULESET} | jq '.enforcement = "disabled"' | \
          gh api \
          --method PUT \
          -H "Accept: application/vnd.github+json" \
          ${RULESET} \
          --input -

      - name: 💾🏷️⬆️ Commit, tag and push
        if: ${{ !inputs.dry-run }}
        run: |
          git add -A
          git commit -S -m "Bump version to ${{ steps.version.outputs.semantic-version }}"
          git push
          git tag -s -a v${{ steps.version.outputs.semantic-version }} -m "mDNS TUI Browser Release v${{ steps.version.outputs.semantic-version }}"
          git push --tags

      - name: 👮 Re-enable enforcement of rules
        if: ${{ always() && !inputs.dry-run }}
        run: |
          gh api \
          -H "Accept: application/vnd.github+json" \
          ${RULESET} | jq '.enforcement = "active"' | \
          gh api \
          --method PUT \
          -H "Accept: application/vnd.github+json" \
          ${RULESET} \
          --input -

      - name: 🗒️ Generate release notes with release-drafter
        if: ${{ !inputs.dry-run && steps.version.outputs.semantic-version != '' }}
        uses: release-drafter/release-drafter@6db134d15f3909ccc9eefd369f02bd1e9cffdf97 # v6.2.0
        with:
          tag: v${{ steps.version.outputs.semantic-version }}
          name: mDNS TUI Browser v${{ steps.version.outputs.semantic-version }}
          prerelease: true
          latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  source-checksums:
    if: ${{ !inputs.dry-run && needs.release.outputs.version != '' }}
    needs: release
    uses: ./.github/workflows/source-checksums-reusable.yml
    with:
      tagName: ${{ needs.release.outputs.version }}

  build-and-publish:
    if: ${{ !inputs.dry-run && needs.release.outputs.version != '' }}
    needs: [release, source-checksums]
    uses: ./.github/workflows/build-reusable.yml
    with:
      tagName: ${{ needs.release.outputs.version }}
