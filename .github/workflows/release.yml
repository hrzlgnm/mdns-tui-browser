name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate_release_tag:
    runs-on: ubuntu-slim
    name: ✅ Validate release tag
    permissions: {}
    steps:
      - name: 🏷️ Validate tag matches vX.Y.Z
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: tag '${TAG_NAME}' does not match the expected release format 'vX.Y.Z'" >&2
            exit 1
          fi
          echo "Tag ${TAG_NAME} is valid"

  create_release_draft:
    needs: [validate_release_tag]
    permissions:
      actions: write # to upload the generated changelog artifact
      contents: write # to create and update releases and drafts
    runs-on: ubuntu-slim
    name: 📝 Draft a new release
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🛑 Fail if any draft release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          DRAFTS=$(gh api "repos/${REPOSITORY}/releases?per_page=100" --paginate \
            -q '[.[] | select(.draft == true) | .tag_name] | join(", ")')
          if [ -n "$DRAFTS" ]; then
            echo "Error: refusing to clobber existing draft release(s): $DRAFTS" >&2
            echo "Delete or publish the draft(s) manually, then re-run." >&2
            exit 1
          fi

      - name: 🛑 Fail if release already exists for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if gh release view "$TAG_NAME" --repo "${REPOSITORY}" >/dev/null 2>&1; then
            echo "Error: release '$TAG_NAME' already exists" >&2
            exit 1
          fi

      - name: 🛑 Fail if previous tag has no published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          TAGS=$(git tag --list 'v*.*.*' --sort=v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          if ! grep -qxF "$TAG_NAME" <<< "$TAGS"; then
            echo "Error: current tag '$TAG_NAME' not found among repository tags" >&2
            exit 1
          fi
          PREV_TAG=$(awk -v tag="$TAG_NAME" '$0 == tag { print prev; exit } { prev = $0 }' <<< "$TAGS")
          if [ -z "$PREV_TAG" ]; then
            echo "No previous version tag before $TAG_NAME; skipping previous-release check"
            exit 0
          fi
          IS_DRAFT=$(gh release view "$PREV_TAG" --repo "$REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null) || {
            echo "Error: previous tag '$PREV_TAG' has no associated release; publish it before releasing '$TAG_NAME'" >&2
            exit 1
          }
          if [ "$IS_DRAFT" = "true" ]; then
            echo "Error: previous tag '$PREV_TAG' has only a draft release; publish it before releasing '$TAG_NAME'" >&2
            exit 1
          fi
          echo "Previous tag $PREV_TAG has a published release"

      - name: 🦀 Install Rust toolchain for git-cliff build fallback
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: 🔧 Install git-cliff
        uses: baptiste0928/cargo-install@f204293d9709061b7bc1756fec3ec4e2cd57dec0 # v3
        with:
          crate: git-cliff
          version: 2.14.1
          locked: true
          cache-key: ${{ github.job }}-${{ strategy.job-index }}

      - name: 📝 Update CHANGELOG.md with the new version
        run: |
          git-cliff --output CHANGELOG.md

      - name: 🎯 Sync version from tag
        uses: ./.github/actions/sync-version
        with:
          tagName: ${{ github.ref_name }}

      - name: 📤 Upload versioned sources artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: versioned-sources
          path: |
            CHANGELOG.md
            Cargo.toml
            Cargo.lock

      - name: 🗒️ Generate release notes with git-cliff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git-cliff --offline --config .github/cliff-release.toml --current --output release-body.md

      - name: 🚀 Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          gh release create "$TAG_NAME" \
            --title "mDNS TUI Browser v${VERSION}" \
            --notes-file release-body.md \
            --draft \
            --latest=false

  source_checksums:
    needs: [validate_release_tag, create_release_draft]
    permissions:
      contents: write # to upload source checksums to release
    name: 🔢 Generate Source Checksums
    uses: ./.github/workflows/source-checksums-reusable.yml
    secrets: inherit
    with:
      tagName: ${{ github.ref_name }}

  build_and_publish:
    needs: [validate_release_tag, create_release_draft]
    permissions:
      id-token: write # needed for OIDC token for attestation
      attestations: write # needed to create build attestations
      contents: write # needed to upload build artifacts
      actions: read # needed to download workflow artifacts
    name: 🔨 Build and Publish
    uses: ./.github/workflows/build-reusable.yml
    secrets: inherit
    with:
      tagName: ${{ github.ref_name }}
