name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate_release_tag:
    runs-on: ubuntu-slim
    name: ✅ Validate release tag
    permissions: {}
    steps:
      - name: 🏷️ Validate tag matches vX.Y.Z
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: tag '${TAG_NAME}' does not match the expected release format 'vX.Y.Z'" >&2
            exit 1
          fi
          echo "Tag ${TAG_NAME} is valid"

  create_release_draft:
    needs: [validate_release_tag]
    permissions:
      actions: write # to upload the generated changelog artifact
      contents: write # to create and update releases and drafts
    runs-on: ubuntu-slim
    name: 📝 Draft a new release
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🧹 Delete pre-existing draft releases
        uses: hugo19941994/delete-draft-releases@3f19a25abf2ce87850c2268938f98f14e4d3d1f1 # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🦀 Install Rust toolchain for git-cliff build fallback
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: 🔧 Install git-cliff
        uses: baptiste0928/cargo-install@f204293d9709061b7bc1756fec3ec4e2cd57dec0 # v3
        with:
          crate: git-cliff
          version: 2.13.1
          locked: true
          cache-key: ${{ github.job }}-${{ strategy.job-index }}

      - name: 📝 Update CHANGELOG.md with the new version
        run: |
          git-cliff --output CHANGELOG.md

      - name: 📤 Upload versioned changelog artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: changelog
          path: CHANGELOG.md

      - name: 🗒️ Generate release notes with git-cliff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git-cliff --offline --config .github/cliff-release.toml --current --output release-body.md

      - name: 🚀 Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          gh release create "$TAG_NAME" \
            --title "mDNS TUI Browser v${VERSION}" \
            --notes-file release-body.md \
            --draft \
            --latest=false

  source_checksums:
    needs: [validate_release_tag, create_release_draft]
    permissions:
      contents: write # to upload source checksums to release
    name: 🔢 Generate Source Checksums
    uses: ./.github/workflows/source-checksums-reusable.yml
    secrets: inherit
    with:
      tagName: ${{ github.ref_name }}

  build_and_publish:
    needs: [validate_release_tag, create_release_draft]
    permissions:
      id-token: write # needed for OIDC token for attestation
      attestations: write # needed to create build attestations
      contents: write # needed to upload build artifacts
      actions: read # needed to download workflow artifacts
    name: 🔨 Build and Publish
    uses: ./.github/workflows/build-reusable.yml
    secrets: inherit
    with:
      tagName: ${{ github.ref_name }}
