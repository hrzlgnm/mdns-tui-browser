name: "📝 Update Changelog"

on:
  push:
    branches:
      - main

permissions:
  contents: write # Needed to push to the update branch
  pull-requests: write # Needed to create/update the pull request

concurrency:
  group: update-changelog
  cancel-in-progress: true

jobs:
  update-changelog:
    name: "📝 Update Unreleased Changelog"
    runs-on: ubuntu-slim
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_ADMIN_TOKEN }}

      - name: 🔍 Get default branch protection ruleset
        id: ruleset
        shell: bash
        run: |
          RULESET="repos/${{ github.repository }}/rulesets/${{ secrets.RULESET_ID }}"
          echo "result=${RULESET}" >> "$GITHUB_OUTPUT"

      - name: ⏳ Temporary disable ruleset enforcement
        run: |
          RULESET="${{ steps.ruleset.outputs.result }}"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "${RULESET}" | jq '.enforcement = "disabled"' | \
            gh api \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              "${RULESET}" \
              --input -

      - name: 🔧 Install git-cliff
        uses: baptiste0928/cargo-install@f204293d9709061b7bc1756fec3ec4e2cd57dec0 # v3
        with:
          crate: git-cliff
          version: 2.13.1
          locked: true

      - name: 📝 Generate changelog
        run: git-cliff --output CHANGELOG.md

      - name: 🔁 Create or update Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GH_ADMIN_TOKEN }}
          branch: chore/update-changelog
          commit-message: "chore(version): update unreleased changelog"
          title: "chore: update unreleased changelog"
          body: |
            Automated update of the `[Unreleased]` section in `CHANGELOG.md`.

            This PR is created/updated automatically on every push to `main`
            by running `git-cliff` without a version tag.
          labels: chore
          delete-branch: true

      - name: 👮 Re-enable enforcement of rules
        if: always()
        run: |
          RULESET="${{ steps.ruleset.outputs.result }}"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "${RULESET}" | jq '.enforcement = "active"' | \
            gh api \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              "${RULESET}" \
              --input -
