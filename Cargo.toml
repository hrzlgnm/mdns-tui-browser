[package]
name = "mdns-tui-browser"
version = "1.30.1"
edition = "2024"
rust-version = "1.88"
description = "A TUI browser for mDNS service discovery"

[package.metadata.deb]
maintainer = "hrzlgnm"
copyright = "Copyright 2026 hrzlgnm"
license-file = "LICENSE"
depends = "libgcc-s1 (>= 4.2)"
assets = [
    [
        "docs/mdns-tui-browser.1",
        "usr/share/man/man1/mdns-tui-browser.1",
        "644",
    ],
    [
        "target/release/mdns-tui-browser",
        "usr/bin/",
        "755",
    ],
]

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
debug = true
split-debuginfo = "packed"
strip = true

[dependencies]
mdns-sd = { git = "https://github.com/keepsimple1/mdns-sd.git", rev = "d5f906028c45b15e1ce8ee9edd4b05a51c35fb3a" }
tokio = { version = "1.0", features = ["full"] }
ratatui = "0.30"
crossterm = "0.29"
flume = "0.12"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
if-addrs = "0.15"
open = "5"
url = "2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal"] }
